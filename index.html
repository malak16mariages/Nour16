<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خدمات مساج - الحجز</title>

<style>
body{
margin:0;
font-family:Arial;
background:url("https://images.unsplash.com/photo-1544161515-4ab6ce6db874") center/cover no-repeat fixed;
color:white;
display:flex;
justify-content:center;
padding:20px;
}

.container{
width:100%;
max-width:450px;
background:rgba(0,0,0,0.75);
backdrop-filter:blur(10px);
padding:20px;
border-radius:18px;
border:1px solid rgba(255,255,255,0.1);
box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

h2{
text-align:center;
color:#00ffcc;
}

input,select,button{
width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:none;
outline:none;
}

button{
background:linear-gradient(135deg,#00ffcc,#00b3a6);
color:black;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

.step{display:none;}
.active{display:block;}

#closed{
display:none;
text-align:center;
padding:15px;
margin-bottom:10px;
border:1px solid rgba(255,255,255,0.1);
border-radius:10px;
}

.small{
font-size:12px;
opacity:0.8;
text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h2>حجز خدمات مساج</h2>

<p class="small">⏰ وقت العمل: من 22:00 إلى 07:00</p>

<!-- ⛔ الإغلاق -->
<div id="closed">
<h2>⛔ الموقع مغلق</h2>
<p>أوقات العمل من 22:00 إلى 07:00</p>
<h3 id="countdown" style="color:#00ffcc;"></h3>
</div>

<!-- STEP 1 -->
<div id="step1" class="step active">

<input type="text" id="name" placeholder="الاسم">
<input type="text" id="lastname" placeholder="اللقب">
<input type="tel" id="phone" placeholder="رقم الهاتف">

<select id="state">
<option>اختر الولاية</option>
<option>الجزائر</option>
<option>وهران</option>
<option>قسنطينة</option>
<option>باتنة</option>
<option>بجاية</option>
<option>سطيف</option>
<option>عنابة</option>
<option>تلمسان</option>
</select>

<select id="service">
<option>اختر الخدمة</option>
<option>مساج عادي</option>
<option>مساج VIP</option>
</select>

<button onclick="nextStep()">التالي ➜ الدفع</button>

</div>

<!-- STEP 2 -->
<div id="step2" class="step">

<p class="small">💳 رقم الحساب البريدي:<br><b>00799999004286372491</b></p>

<p class="small">⚠️ يجب رفع وصل الدفع</p>

<input type="file" id="proof">

<button onclick="send()">تأكيد الحجز</button>
